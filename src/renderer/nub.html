<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rice</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; user-select:none; -webkit-user-select:none; }
  /* a janelinha é sempre escura: barra de rolagem fina e discreta, igual à da janela principal */
  :root { color-scheme:dark; }
  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:var(--radius-sm); border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background-color:var(--guide); }
  /* Medidas espelham as constantes NUB_* de src/main/app/nub.ts (um teste confere). */
  :root { --pad:10px; --col:22px; --btn-w:104px; --btn-h:30px; --btn-gap:8px; --divider:1px;
    --pill-w:calc(var(--col) + 2 * var(--pad)); --pill-h:calc(3 * var(--btn-h) + 2 * var(--btn-gap) + 2 * var(--pad));
    --bar-w:calc(var(--pad) + var(--btn-w) + var(--pad) + var(--divider) + var(--pill-w)); }
  /* A janela é sempre larga e transparente; só a pílula cresce no hover. Fora da pílula o main ignora cliques. */
  .stage { width:100%; height:100%; display:flex; justify-content:flex-end; align-items:flex-start; }
  body.side-left .stage { justify-content:flex-start; }
  .pill { position:relative; flex:none; width:var(--pill-w); height:var(--pill-h); border-radius:21px; overflow:hidden; display:flex; justify-content:flex-end; background:var(--nub-glass); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); transition:width var(--dur-base) ease, border-radius var(--dur-base) ease; }
  .pill::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:var(--shadow-hairline); pointer-events:none; }
  body.hover .pill { width:var(--bar-w); border-radius:20px; }
  body.side-left .pill { flex-direction:row-reverse; }
  /* coluna do logo + barras: mesma posição de tela em repouso e expandida */
  .core { flex:none; width:var(--pill-w); height:100%; padding:var(--pad); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-3); -webkit-app-region:drag; }
  .logo { width:20px; height:20px; color:var(--ink); flex:none; }
  .hit { -webkit-app-region:no-drag; flex:none; width:var(--col); height:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .btns { flex:none; width:calc(var(--pad) + var(--btn-w)); height:100%; padding:var(--pad) 0 var(--pad) var(--pad); display:flex; flex-direction:column; gap:var(--btn-gap); opacity:0; pointer-events:none; transition:opacity var(--dur-fast) ease 40ms; -webkit-app-region:no-drag; cursor:pointer; }
  body.side-left .btns { padding:var(--pad) var(--pad) var(--pad) 0; }
  body.hover .btns, body.hover .divider { opacity:1; pointer-events:auto; }
  .divider { flex:none; width:var(--divider); margin:var(--pad) 0 var(--pad) var(--pad); background:var(--line); opacity:0; transition:opacity var(--dur-fast) ease 40ms; }
  body.side-left .divider { margin:var(--pad) var(--pad) var(--pad) 0; }
  .act { width:var(--btn-w); height:var(--btn-h); padding:0 var(--space-3); border:0; border-radius:var(--radius-md); background:var(--active); color:var(--ink); display:flex; align-items:center; justify-content:flex-start; gap:var(--space-2); font:var(--fw-medium) var(--fs-sm)/1 var(--font-sans); white-space:nowrap; cursor:pointer; -webkit-app-region:no-drag; }
  .act:hover { background:var(--guide); } .act:active { background:var(--guide); }
  .act svg, .act .ico { width:var(--icon-md); height:var(--icon-md); flex:none; }
  .act .ico { display:flex; align-items:center; justify-content:center; }
  body.paused #pause { color:var(--warn); } body.paused .bar { background:var(--warn); } /* pausado: as barras param e ficam âmbar */
  .act .sq { width:9px; height:9px; border-radius:2.var(--radius-sm); background:var(--rec); }
  .bars { display:flex; align-items:center; justify-content:center; gap:var(--space-1); height:16px; }
  .bar { width:3px; height:3px; border-radius:1.var(--radius-sm); background:var(--switch-on); transition:height var(--dur-fast) linear; }
  /* painel de chat expandido */
  .panel { display:none; width:100%; height:100%; flex-direction:column; border-radius:var(--radius-2xl); background:var(--nub-glass-strong); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); border:1px solid var(--line); font:var(--fs-md)/var(--lh-snug) var(--font-sans); color:var(--on-scrim); overflow:hidden; }
  body.open .panel { display:flex; } body.open .stage { display:none; }
  .panel-head { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-25) var(--space-3); -webkit-app-region:drag; }
  .panel-title { flex:1; min-width:0; font-weight:var(--fw-semibold); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel-close { -webkit-app-region:no-drag; width:var(--h-sm); height:var(--h-sm); border:0; border-radius:var(--radius-sm); background:transparent; color:var(--muted); font-size:var(--fs-xl); line-height:20px; padding:0; cursor:pointer; }
  .panel-close:hover { background:var(--active); color:var(--on-accent); }
  .lines { flex:1; min-height:0; overflow:auto; padding:0 var(--space-3) var(--space-2); user-select:text; -webkit-user-select:text; }
  .line { margin:0 0 var(--space-15); font-size:var(--fs-sm); } .line b { font-weight:var(--fw-semibold); margin-right:var(--space-15); } .line.other b { color:var(--muted); font-weight:var(--fw-medium); } .line.partial { color:var(--muted); }
  .convo { max-height:42%; overflow:auto; padding:var(--space-2) var(--space-3); border-top:1px solid var(--active); user-select:text; -webkit-user-select:text; }
  .convo:empty { display:none; }
  .thinking { display:inline-flex; align-items:center; gap:var(--space-2); color:var(--muted); font-size:var(--fs-md); } .thinking .dots { display:inline-flex; gap:var(--space-1); } .thinking .dots i { width:5px; height:5px; border-radius:50%; background:currentColor; animation:thinking-dot 1.2s ease-in-out infinite; } .thinking .dots i:nth-child(2) { animation-delay:.18s; } .thinking .dots i:nth-child(3) { animation-delay:.36s; }
  @keyframes thinking-dot { 0%, 80%, 100% { opacity:var(--op-xs); } 40% { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .thinking .dots i { animation:none; opacity:var(--op-sm); } }
  .q { color:var(--muted); margin:0 0 var(--space-1); } .a { margin:0 0 var(--space-25); white-space:pre-wrap; }
  .ask { padding:var(--space-2) var(--space-3) var(--space-3); }
  .ask input { appearance:none; -webkit-appearance:none; width:100%; font:inherit; font-size:var(--fs-md); line-height:var(--lh-snug); padding:var(--space-2) var(--space-25); border-radius:var(--radius-md); border:1px solid var(--line); background:var(--field-bg); color:inherit; outline:none; }
  .ask input::placeholder { color:var(--muted); } .ask input:focus { border-color:var(--accent); box-shadow:var(--shadow-focus); }
</style>
</head>
<body>
  <div class="stage">
    <div class="pill" id="pill">
      <div class="btns" id="btns" data-i18n-title="nub.open" title="Abrir o Rice">
        <button class="act" id="chat" data-i18n-title="nub.ask.title" data-i18n-aria="nub.ask.title" title="Perguntar sobre a reunião" aria-label="Perguntar sobre a reunião">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
          <span data-i18n="nub.ask">Perguntar</span>
        </button>
        <button class="act" id="pause" data-i18n-title="rec.pause.title" data-i18n-aria="rec.pause.title" title="Pausar a gravação" aria-label="Pausar a gravação"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></span><span id="pause-label" data-i18n="rec.pause">Pausar</span></button>
        <button class="act" id="stop" data-i18n-title="nub.stop.title" data-i18n-aria="nub.stop.title" title="Parar a gravação" aria-label="Parar a gravação"><span class="ico"><span class="sq"></span></span><span data-i18n="nub.stop">Parar</span></button>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="core">
        <svg class="logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M267 462 C274 405 312 366 357 365 C371 326 408 299 451 315 C470 283 499 263 528 263 C558 263 587 283 606 315 C649 299 686 326 700 365 C745 366 783 405 790 462 Z" transform="translate(2 3.3) scale(.03273) translate(-223 -263)"/>
          <path d="M223 490 H834 A305.5 305.5 0 0 1 223 490 Z" transform="translate(2 3.3) scale(.03273) translate(-223 -263)"/>
        </svg>
        <div class="hit" id="hit" data-i18n-title="nub.open" title="Abrir o Rice"><span class="bars" id="bars"></span></div>
      </div>
    </div>
  </div>
  <div class="panel" id="panel" role="dialog" data-i18n-aria="nub.placeholder" aria-label="Pergunte sobre a reunião…">
    <div class="panel-head"><span class="panel-title" id="panel-title" data-i18n="meeting.default-title">Reunião</span><button class="panel-close" id="close" data-i18n-title="nub.collapse" data-i18n-aria="nub.collapse" title="Recolher" aria-label="Recolher">×</button></div>
    <div class="lines" id="lines"></div>
    <div class="convo" id="convo"></div>
    <form class="ask" id="ask"><input id="question" data-i18n-placeholder="nub.placeholder" data-i18n-aria="nub.placeholder" placeholder="Pergunte sobre a reunião…" autocomplete="off" aria-label="Pergunte sobre a reunião…"></form>
  </div>
  <script src="i18n.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/en.js"></script>
  <script src="nub.js"></script>
</body>
</html>
