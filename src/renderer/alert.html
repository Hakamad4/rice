<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rice</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; user-select:none; -webkit-user-select:none; }
  body { padding:var(--space-2) var(--space-25) var(--space-3); font:var(--fs-md)/var(--lh-snug) var(--font-sans); color:var(--ink); }
  .card { position:relative; height:100%; border-radius:var(--radius-xl); padding:var(--space-3) 34px var(--space-25) var(--space-4); background:color-mix(in srgb, var(--bg) 96%, transparent); border:1px solid var(--line); box-shadow:var(--shadow-pop); cursor:pointer; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
  .bar { position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--muted); }
  .title { font-weight:var(--fw-semibold); font-size:var(--fs-lg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .time { color:var(--muted); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:var(--space-15); }
  button { font:inherit; font-size:var(--fs-sm); border:0; border-radius:var(--radius-sm); padding:var(--space-1) var(--space-25); cursor:pointer; background:var(--active); color:inherit; }
  button.primary { background:var(--ink); color:var(--bg); }
  .x { position:absolute; top:var(--space-15); right:var(--space-15); width:var(--h-sm); height:var(--h-sm); padding:0; background:transparent; color:var(--muted); font-size:var(--fs-base); line-height:20px; }
  .x:hover { background:var(--active); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bar" id="bar"></div>
    <div><div class="title" id="title"></div><div class="time" id="time"></div></div>
    <div class="actions"><button class="primary" id="join"></button><button id="record" data-i18n="alert.only-record">Só gravar</button></div>
    <button class="x" id="close" data-i18n-title="alert.close" data-i18n-aria="alert.close" title="Fechar" aria-label="Fechar">×</button>
  </div>
  <script src="i18n.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="locales/en.js"></script>
  <script src="alert.js"></script>
</body>
</html>
