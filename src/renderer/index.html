<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Rice</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; }
  html, body { overflow:hidden; } /* só as áreas internas rolam: nunca a janela inteira */
  body { margin:0; font:var(--fs-base)/var(--lh-loose) var(--font-sans); background:var(--bg); color:var(--ink); display:grid; grid-template-columns:var(--side-w) minmax(0,1fr) 0; -webkit-font-smoothing:antialiased; }
  body.chat-open { grid-template-columns:var(--side-w) minmax(0,1fr) var(--chat-w); }
  body.side-collapsed { grid-template-columns:0 minmax(0,1fr) 0; }
  body.side-collapsed.chat-open { grid-template-columns:0 minmax(0,1fr) var(--chat-w); }
  body.side-collapsed aside { visibility:hidden; overflow:hidden; padding:0; }

  /* barra de título integrada: faixa de 52px arrastável; tudo que é clicável fica fora da região de arrasto */
  /* --titlebar 48px: o centro da faixa (24px) é o centro dos semáforos (trafficLightPosition y:18 + 6); --side-w, --chat-w, --traffic e --title-size vêm de design/tokens.css */
  /*
   * REGRAS DE ARRASTO (macOS/Electron): as regiões drag/no-drag valem pela ORDEM DO DOM — a última que cobre um ponto vence;
   * z-index não conta. Por isso: (1) todo elemento no-drag que fica sobre uma região drag vem DEPOIS dela no DOM
   * (.win-tools é o último filho do body) e (2) as regiões drag não passam por cima dos botões (a faixa da sidebar é
   * recortada: um trecho até os semáforos e outro depois dos botões). Um teste confere as duas coisas.
   */
  :root { --tools-width:40px; --tools-left:calc(var(--side-w) - 36px); } /* um botão de 28px + folga; à direita da sidebar (232 − 8 de margem − 28) */
  body.side-collapsed { --tools-left:var(--traffic); }
  /* alças de redimensionar (6px de área; linha sutil no hover/arrasto) */
  .rz-handle { position:fixed; top:0; bottom:0; width:6px; z-index:var(--z-handle); cursor:col-resize; -webkit-app-region:no-drag; outline:none; }
  .rz-handle::after { content:""; position:absolute; top:0; bottom:0; left:2px; width:1px; background:transparent; transition:background var(--dur-fast); }
  .rz-handle:hover::after, .rz-handle.dragging::after, .rz-handle:focus-visible::after { background:var(--line); }
  .rz-side { left:calc(var(--side-w) - 3px); } .rz-chat { right:calc(var(--chat-w) - 3px); display:none; }
  body.side-collapsed .rz-side { display:none; } body.chat-open .rz-chat { display:block; } body.resizing { cursor:col-resize; user-select:none; } /* recolhida: logo depois dos semáforos */
  .side-drag { position:absolute; top:0; height:var(--titlebar); -webkit-app-region:drag; }
  .side-drag-left { left:0; width:var(--tools-left); }
  .side-drag-right { left:calc(var(--tools-left) + var(--tools-width)); right:0; }
  .win-tools { position:fixed; top:0; left:var(--tools-left); height:var(--titlebar); /* centro = centro dos semáforos */ display:flex; align-items:center; gap:var(--space-1); z-index:var(--z-chrome); -webkit-app-region:no-drag; }
  .win-tools button, #rec-bar button, #rec-bar input, #rec-bar a { -webkit-app-region:no-drag; }
  /* popovers e menus ficam sempre fora da região de arrasto: no macOS um clique em drag vira arrasto da janela */
  [class*="popover"], [role="menu"], [role="listbox"], .tpl-picker-root, #rec-bar select, #rec-bar textarea, #rec-bar [tabindex] { -webkit-app-region:no-drag; }
  .icon-btn { width:var(--h-md); height:var(--h-md); padding:0; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); border-radius:var(--radius-sm); }
  .icon-btn:hover:not(:disabled) { color:var(--ink); } .icon-btn[aria-pressed="true"] { color:var(--ink); background:var(--active); }
  .icon-btn svg { width:var(--icon-lg); height:var(--icon-lg); }
  /* campo de busca da sidebar: ícone à esquerda, ⌘K à direita (vazio) ou × (com texto) */
  .search-box { display:flex; align-items:center; gap:var(--space-2); height:var(--h-md); margin:0 0 var(--space-3); padding:0 var(--space-2) 0 var(--space-25); border:1px solid var(--line); border-radius:var(--radius-md); background:var(--field-bg); color:var(--muted); }
  .search-box:focus-within { border-color:var(--muted); color:var(--ink); } /* neutro como os outros campos: a busca abre focada e o anel azul destoava */
  .search-box input#search { flex:1; min-width:0; height:100%; padding:0; border:0; border-radius:0; background:transparent; box-shadow:none; font-size:var(--fs-md); }
  .search-box input#search:focus { border:0; box-shadow:none; }
  .kbd-hint { font:var(--fs-xs)/1 var(--font-sans); color:var(--faint); padding:var(--space-05) var(--space-1); border-radius:var(--radius-xs); box-shadow:var(--shadow-hairline); }
  .search-clear { flex:none; width:18px; height:18px; padding:0; border-radius:var(--radius-xs); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; }
  .search-clear .icon { width:var(--icon-sm); height:var(--icon-sm); }
  .search-clear[hidden], .kbd-hint[hidden] { display:none; }
  ::-webkit-scrollbar { width:10px; } ::-webkit-scrollbar-thumb { background:var(--line); border-radius:var(--radius-sm); border:2px solid transparent; background-clip:padding-box; }
  button { font:inherit; font-size:var(--fs-md); border:0; background:transparent; color:var(--ink); border-radius:var(--radius-md); padding:var(--space-15) var(--space-25); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--hover); } button:disabled { opacity:var(--op-xs); cursor:default; }
  /* campos: um estilo só para todo input/textarea/select */
  :where(input:not([type=checkbox]):not([type=radio]):not([type=range])), textarea, select { appearance:none; -webkit-appearance:none; font:inherit; font-size:var(--fs-md); line-height:var(--lh-snug); color:var(--ink); background:var(--field-bg); border:1px solid var(--line); border-radius:var(--radius-md); padding:var(--space-2) var(--space-25); outline:none; min-width:0; }
  input:not([type=checkbox]):not([type=radio]):not([type=range])::placeholder, textarea::placeholder { color:var(--muted); opacity:1; }
  :where(input:not([type=checkbox]):not([type=radio]):not([type=range])):focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); box-shadow:var(--shadow-focus); }
  input:disabled, textarea:disabled, select:disabled { opacity:var(--op-sm); }
  input[type=search]::-webkit-search-cancel-button { -webkit-appearance:none; }
  button:focus-visible, .meeting:focus-visible, [role=option]:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button.primary { background:var(--ink); color:var(--bg); font-weight:var(--fw-medium); }
  button.primary:hover:not(:disabled) { background:var(--ink); opacity:var(--op-md); }

  /* barra lateral */
  aside { position:relative; background:var(--sidebar); display:flex; flex-direction:column; min-height:0; padding:var(--titlebar) var(--space-2) var(--space-25); }
  .brand { display:flex; align-items:center; gap:var(--space-2); font-weight:var(--fw-semibold); font-size:var(--fs-lg); padding:var(--space-05) var(--space-25) var(--space-3); }
  .brand-mark { display:inline-flex; color:var(--ink); } .brand-mark svg { width:var(--icon-xl); height:var(--icon-xl); }
  .guide-mark { display:inline-flex; color:var(--ink); margin:0 0 var(--space-3); } .guide-mark svg { width:var(--h-md); height:var(--h-md); }
  .nav-item { display:block; width:100%; text-align:left; padding:var(--space-15) var(--space-25); margin:0 0 var(--space-05); border-radius:var(--radius-sm); color:var(--muted); font-size:var(--fs-md); }
  .nav-item:hover { color:var(--ink); } .nav-item.active { background:var(--active); color:var(--ink); }
  aside > * { flex:none; }
  /* O menu (8 itens, sempre com ícone e nome) só rola quando tudo junto não cabe: encolhe antes da lista, nunca abaixo de ~3 itens, e um fade sutil indica que há mais. Busca e logo ficam fixos no topo, o rodapé fixo embaixo. */
  aside > .side-menu { flex:0 1 auto; min-height:108px; overflow-y:auto; overflow-x:hidden; margin:0 calc(-1 * var(--space-2)); padding:0 var(--space-2); scrollbar-width:none; }
  .side-menu::-webkit-scrollbar { display:none; }
  .side-menu[data-fade="top"] { -webkit-mask-image:linear-gradient(to bottom, transparent 0, var(--mask-on) 16px); mask-image:linear-gradient(to bottom, transparent 0, var(--mask-on) 16px); }
  .side-menu[data-fade="bottom"] { -webkit-mask-image:linear-gradient(to bottom, var(--mask-on) calc(100% - 16px), transparent 100%); mask-image:linear-gradient(to bottom, var(--mask-on) calc(100% - 16px), transparent 100%); }
  .side-menu[data-fade="both"] { -webkit-mask-image:linear-gradient(to bottom, transparent 0, var(--mask-on) 16px, var(--mask-on) calc(100% - 16px), transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, var(--mask-on) 16px, var(--mask-on) calc(100% - 16px), transparent 100%); }
  aside > .side-scroll { flex:1 1 auto; min-height:64px; overflow-y:auto; overflow-x:hidden; margin:0 calc(-1 * var(--space-2)); padding:0 var(--space-2); }
  #list { margin-top:var(--space-2); }
  .group-label { font-size:var(--fs-xs); color:var(--muted); padding:var(--space-3) var(--space-25) var(--space-1); }
  .meeting { display:flex; align-items:center; gap:var(--space-2); box-sizing:border-box; height:var(--h-md); padding:0 var(--space-2) 0 var(--space-25); margin:0 0 var(--space-05); border-radius:var(--radius-sm); cursor:pointer; font-size:var(--fs-md); }
  .meeting:hover { background:var(--hover); } .meeting.active { background:var(--active); }
  .meeting .m-title { flex:1; min-width:0; line-height:var(--lh-snug); letter-spacing:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live-dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--rec); align-self:center; }
  .live-item { display:flex; align-items:center; gap:var(--space-2); width:100%; padding:var(--space-2) var(--space-25); margin:0 0 var(--space-15); border-radius:var(--radius-md); font-size:var(--fs-md); text-align:left; background:var(--hover); color:var(--ink); } .live-item[hidden] { display:none; } .live-item:hover, .live-item.active { background:var(--active); } .live-item .live-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .live-card { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-25) var(--space-3); margin:0 0 var(--space-4); border-radius:var(--radius-lg); background:var(--hover); } .live-card-body { flex:1; min-width:0; display:flex; flex-direction:column; } .live-card-body small { color:var(--muted); font-size:var(--fs-xs); } .live-card-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-lg); }
  .m-dot { width:6px; height:6px; border-radius:50%; background:var(--faint); flex:none; align-self:center; }
  .meeting small { color:var(--muted); font-size:var(--fs-xs); font-variant-numeric:tabular-nums; }
  .side-foot { padding-top:var(--space-15); }
  .root { color:var(--faint); font-size:var(--fs-xs); padding:0 var(--space-25) var(--space-05); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* centro */
  #center { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; height:100vh; }
  #rec-bar { display:flex; align-items:center; gap:var(--space-2); padding:0 20px; height:var(--titlebar); flex:none; -webkit-app-region:drag; }
  body.side-collapsed #rec-bar { padding-left:calc(var(--traffic) + 44px); }
  #status { flex:1; min-width:0; color:var(--muted); font-size:var(--fs-sm); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #rec-bar { min-width:0; overflow:hidden; }
  #rec-bar button { white-space:nowrap; flex:none; }
  /* a faixa é um contêiner: quando falta espaço o texto vira ícone, nesta ordem — Pergunte ao Rice, idioma, Gravar. Nunca texto cortado com "…" */
  #rec-bar { container-type:inline-size; container-name:recbar; }
  #chat-toggle { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-15); height:var(--h-lg); } #chat-toggle .ico { display:none; } #chat-toggle .ico .icon { width:var(--icon-lg); height:var(--icon-lg); }
  #rec .rec-short { display:none; }
  @container recbar (max-width: 600px) { #chat-toggle { width:32px; padding:0; } #chat-toggle .lbl { display:none; } #chat-toggle .ico { display:inline-flex; } .mic-chip { max-width:34px; padding:0 var(--space-15); } .mic-chip-name, .mic-chip-tag { display:none; } } /* faixa estreita: o chip do microfone vira só o ícone (o nome fica no title) */
  @container recbar (max-width: 500px) { .lang-chip { width:32px; padding:0; justify-content:center; } .lang-chip .lang-short, .lang-chip .icon.caret { display:none; } .pause-btn .pause-label { display:none; } .pause-btn { width:32px; padding:0; justify-content:center; } }
  @container recbar (max-width: 420px) { #rec .rec-long { display:none; } #rec .rec-short { display:inline; } }
  @container recbar (max-width: 330px) { #rec { width:var(--h-lg); height:var(--h-lg); min-width:32px; padding:0; justify-content:center; align-items:center; gap:0; aspect-ratio:1; } #rec .rec-short, #rec .rec-long { display:none; } #lang-slot { display:none; } } /* faixa mínima: cabem Pausar, Parar e o chat; o idioma da reunião continua nas Configurações */
  /* janela estreita com o chat aberto: a sidebar recolhe sozinha (e volta quando o chat fecha ou a janela cresce); a coluna central nunca fica < ~420px.
     `side-open` = o usuário reabriu a sidebar à mão. */
  @media (max-width: 1000px) {
    body.chat-open:not(.side-open) { grid-template-columns:0 minmax(0,1fr) var(--chat-w); --tools-left:var(--traffic); }
    body.chat-open:not(.side-open) aside { visibility:hidden; overflow:hidden; padding:0; }
    body.chat-open:not(.side-open) #rec-bar { padding-left:calc(var(--traffic) + 44px); }
    body.chat-open:not(.side-open) .rz-side { display:none; } /* sidebar recolhida sozinha: sem alça; a largura salva volta ao reabrir */
  }
  /* abaixo de ~760px o chat abre por cima (à direita, com sombra) em vez de dividir a tela */
  @media (max-width: 760px) {
    .rz-side, body.chat-open .rz-chat { display:none; }
    body.chat-open:is(.side-open, :not(.side-open)), body.chat-open.side-collapsed { grid-template-columns:0 minmax(0,1fr) 0; }
    body.chat-open #chat { position:fixed; top:0; right:0; bottom:0; width:min(340px, 92vw); z-index:var(--z-drawer); box-shadow:var(--shadow-drawer); border-left:1px solid var(--line); }
    /* chat por cima: o resto da tela escurece (clicar fecha) e o botão de fechar aparece no cabeçalho */
    body.chat-open .chat-scrim { display:block; } body.chat-open .chat-close { display:inline-flex; }
  }
  #rec { display:inline-flex; align-items:center; gap:var(--space-2); padding:var(--space-15) var(--space-3); border-radius:var(--radius-pill); box-shadow:var(--shadow-hairline); font-weight:var(--fw-medium); }
  .rec-dot { flex:none; width:8px; height:8px; min-width:8px; min-height:8px; aspect-ratio:1; border-radius:50%; background:var(--rec); } /* círculo sempre redondo: não encolhe nem achata */
  /* batida de 1 Hz pelo timer da gravação (renderer.js): uma animação CSS infinita mantinha renderer e GPU acordados a 60 quadros/s (~15% de um núcleo) só para um ponto pulsar */
  body.beat-off .live-dot:not(.paused), body.beat-off #rec.recording:not(.paused) .rec-dot { opacity:var(--op-xs); }
  #live-jump { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); display:inline-flex; align-items:center; gap:var(--space-15); height:var(--h-md); padding:0 var(--space-3); border-radius:var(--radius-pill); font-size:var(--fs-sm); background:var(--ink); color:var(--bg); box-shadow:var(--shadow-pop); z-index:var(--z-raised); } #live-jump[hidden] { display:none; } #live-jump .icon { width:var(--icon-sm); height:var(--icon-sm); }
  #detail { flex:1; overflow:auto; container-type:inline-size; container-name:detail; }
  /* avisos persistentes da gravação: faixa fina, sem cor berrante; o nível aparece só na barrinha da esquerda */
  #alerts { display:flex; flex-direction:column; gap:1px; border-bottom:1px solid var(--line); background:var(--line); }
  #alerts[hidden] { display:none; }
  .alert { display:flex; align-items:center; gap:var(--space-3); padding:var(--space-2) var(--space-4); background:var(--bg); border-left:3px solid var(--muted); font-size:var(--fs-md); line-height:var(--lh-snug); }
  .alert.error { border-left-color:var(--danger); } .alert.warn { border-left-color:var(--accent); }
  .alert-text { flex:1; min-width:0; }
  .alert button { flex:none; font-size:var(--fs-sm); padding:var(--space-1) var(--space-2); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-sm); } .alert button:hover { background:var(--hover); }
  .alert .alert-x { border:0; padding:var(--space-1) var(--space-15); color:var(--muted); }
  .page { max-width:776px; margin:0 auto; padding:var(--space-5) clamp(40px, 6cqi, var(--space-8)) calc(var(--space-8) + var(--space-5)); }
  @container detail (max-width: 520px) { .page { padding-left:var(--space-5); padding-right:var(--space-5); } .page-title { margin-bottom:var(--space-3); } .page-meta { margin-bottom:var(--space-5); } .setting-section + .setting-section, .step + .step { margin-top:var(--space-6); padding-top:var(--space-6); } }
  .page > * { max-width:680px; }
  .page-title { font-size:var(--title-size); line-height:var(--lh-tight); font-weight:var(--fw-semibold); padding:var(--space-05) var(--space-25); margin:calc(-1 * var(--space-05)) calc(-1 * var(--space-25)) var(--space-5); letter-spacing:-.01em; cursor:text; border-radius:var(--radius-md); } /* padding com margem negativa: o hover tem respiro e o texto não se move */
  .page-title:hover { background:var(--hover); }
  .title-row { display:flex; align-items:center; gap:var(--space-2); margin:0 0 var(--space-15); }
  .title-row .page-title { margin:calc(-1 * var(--space-05)) calc(-1 * var(--space-25)); min-width:0; }
  .pencil { flex:none; width:var(--h-md); height:var(--h-md); padding:0; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); opacity:var(--op-xs); border-radius:var(--radius-sm); }
  .pencil svg { width:var(--icon-lg); height:var(--icon-lg); } .title-row:hover .pencil, .pencil:focus-visible { opacity:1; }
  /* mesmo tamanho/peso do título em leitura; margem negativa compensa padding+borda para o texto não pular */
  input.page-title.title-edit { font-size:var(--title-size); font-weight:var(--fw-semibold); line-height:var(--lh-tight); letter-spacing:-.01em; color:var(--ink); padding:var(--space-05) var(--space-25); margin:calc(-1 * var(--space-05)) calc(-1 * var(--space-25)); border:0; border-radius:var(--radius-md); background:var(--hover); box-shadow:var(--shadow-focus-sm); field-sizing:content; min-width:12ch; max-width:calc(100% + 22px); cursor:text; } /* mesmo corpo e mesma caixa do modo leitura: o texto não muda de tamanho nem de lugar */
  .meeting input.title-edit { font-size:var(--fs-md); font-weight:var(--fw-regular); line-height:var(--lh-snug); letter-spacing:normal; color:var(--ink); padding:0; margin:0; border:0; border-radius:var(--radius-xs); background:var(--hover); box-shadow:var(--shadow-focus-sm); width:100%; height:var(--h-sm); field-sizing:fixed; }
  .page-meta { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-1) var(--space-3); color:var(--muted); font-size:var(--fs-sm); margin:0 0 var(--space-6); }
  .page-actions { display:flex; flex-wrap:wrap; gap:var(--space-2); margin:0 calc(-1 * var(--space-25)); }
  .page-actions button { color:var(--muted); font-size:var(--fs-sm); } .page-actions button:hover:not(:disabled) { color:var(--ink); }
  .recover-note { flex-basis:100%; display:flex; align-items:center; gap:var(--space-3); margin:var(--space-2) var(--space-25) 0; font-size:var(--fs-md); color:var(--muted); }
  .recover-note button { font-size:var(--fs-sm); padding:var(--space-1) var(--space-25); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-sm); } .recover-note button:hover:not(:disabled) { background:var(--hover); }
  .page-actions .spacer { flex:1; }
  .damaged-actions { margin-top:var(--space-4); } /* botão principal sozinho: alinhado ao texto, sem a margem negativa das ações discretas */
  /* título estático (páginas Templates, Configurações, Como usar, Início, editores): sem caixa nem respiro lateral, texto na borda do conteúdo */
  .page-title.static { cursor:default; padding:0; margin:0 0 var(--space-5); border-radius:0; } .page-title.static:hover { background:none; }
  .tpl-head-grid { display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:var(--space-4); row-gap:var(--space-5); align-items:center; }
  .tpl-head-grid > .page-title.static { grid-column:1; grid-row:1; margin:0; }
  .tpl-head-grid > .tpl-new { grid-column:2; grid-row:1; white-space:nowrap; }
  .tpl-head-grid > .tpl-tabbar { grid-column:1 / -1; grid-row:2; }
  .tpl-new { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; } .tpl-new svg { width:var(--icon-md); height:var(--icon-md); margin-right:var(--space-15); flex:none; display:block; }
  @container detail (max-width: 520px) { .tpl-head-grid { grid-template-columns:minmax(0,1fr); } .tpl-head-grid > .tpl-new { grid-column:1; grid-row:3; justify-self:end; } }

  .cmd { margin:var(--space-15) 0; } .row { display:flex; gap:var(--space-2); flex-wrap:wrap; align-items:center; margin:var(--space-25) 0; }
  .row input { flex:1; min-width:200px; }
  .feedback.ok { color:var(--muted); } .feedback.bad { color:var(--danger); } .howto { margin:var(--space-2) 0; padding-left:20px; }

  /* Windows (body.platform-win): sem semáforos nem o recuo à esquerda; os botões nativos (titleBarOverlay, ~140px) ficam no canto direito
     e nada do que está no topo direito (barra de gravação sem chat, cabeçalho do chat com chat) passa por baixo deles */
  :root { --overlay-r:0px; }
  body.platform-win:not(.chat-open) #rec-bar { padding-right:calc(20px + var(--overlay-r)); }
  body.platform-win.chat-open .chat-head { padding-right:calc(var(--space-4) + var(--overlay-r)); min-height:var(--titlebar); box-sizing:border-box; }
  /* chat estreito: o título não cabe ao lado dos botões nativos; o cabeçalho desce para baixo deles (nada de título quebrado) */
  body.platform-win #chat { container:chat / inline-size; }
  @container chat (max-width:400px) { body.platform-win.chat-open .chat-head { padding-right:var(--space-4); padding-top:calc(var(--titlebar) + var(--space-05)); } }
</style>
</head>
<body>
  <div class="rz-handle rz-side" id="rz-side"></div>
  <div class="rz-handle rz-chat" id="rz-chat"></div>
  <aside>
    <div class="side-drag side-drag-left"></div>
    <div class="side-drag side-drag-right"></div>
    <div class="brand"><span class="ico brand-mark" data-icon="rice"></span><span>Rice</span></div>
    <div class="search-box" id="search-box">
      <span class="ico" data-icon="search"></span>
      <input id="search" type="search" aria-controls="results" data-i18n-placeholder="win.search-ph" data-i18n-aria="win.search" placeholder="Buscar reuniões" aria-label="Buscar reuniões" autocomplete="off" spellcheck="false">
      <kbd class="kbd-hint" id="search-hint">⌘K</kbd>
      <button class="search-clear" id="search-clear" type="button" data-i18n-title="win.search-clear" data-i18n-aria="win.search-clear" title="Limpar busca" aria-label="Limpar busca" hidden><span class="ico" data-icon="x"></span></button>
    </div>
    <nav class="side-menu" id="side-menu">
    <button class="nav-item" id="home-link"><span class="ico" data-icon="home"></span><span data-i18n="nav.home">Início</span></button>
    <button class="nav-item" id="followups-link"><span class="ico" data-icon="check-circle"></span><span data-i18n="nav.followups">Pendências</span><span id="followups-badge" class="nav-badge" hidden></span></button>
    <button class="nav-item" id="memory-link"><span class="ico" data-icon="history"></span><span data-i18n="nav.memory">Memória</span></button>
    <button class="nav-item" id="new"><span class="ico" data-icon="plus"></span><span data-i18n="nav.new">Nova reunião</span></button>
    <button class="nav-item" id="new-war"><span class="ico" data-icon="radar"></span><span data-i18n="nav.new-war">Nova war room</span></button>
    <button class="nav-item" id="templates-link"><span class="ico" data-icon="file-text"></span><span data-i18n="nav.templates">Templates</span></button>
    <button class="nav-item" id="settings-link"><span class="ico" data-icon="settings"></span><span data-i18n="nav.settings">Configurações</span></button>
    <button class="nav-item" id="guide-link"><span class="ico" data-icon="help-circle"></span><span data-i18n="nav.guide">Como usar o Rice</span></button>
    </nav>
    <div class="side-scroll" id="side-scroll">
    <button class="live-item" id="live-item" type="button" hidden></button>
    <div class="folders-head">
      <span class="folders-title" data-i18n="folder.header">Pastas</span>
      <button class="icon-btn folders-add" id="folder-new" type="button" data-i18n-title="folder.new" data-i18n-aria="folder.new" title="Nova pasta" aria-label="Nova pasta"><span class="ico" data-icon="folder-plus"></span></button>
    </div>
    <div id="folders"></div>
    <div id="list"></div>
    <div id="results" role="listbox" hidden></div>
    </div>
    <div class="side-foot">
      <div class="local-badge" id="local-badge" hidden role="status"><span class="ico" data-icon="shield"></span><span data-i18n="local.badge">100% local</span></div>
      <div class="root" id="root"></div>
      <button class="nav-item" id="choose"><span class="ico" data-icon="folder"></span><span data-i18n="nav.choose-folder">Escolher pasta…</span></button>
    </div>
  </aside>
  <div id="center">
    <div id="update-banner" role="status" hidden></div>
    <div id="rec-bar">
      <span id="status" class="empty"></span>
      <div id="mic-chip" class="mic-chip" role="status" hidden></div>
      <button id="shots-chip" type="button" class="shots-chip" hidden></button>
      <button id="shots-capture" type="button" class="icon-btn shots-capture" hidden></button>
      <button id="retry" data-i18n="rec.retry" hidden>Tentar de novo</button>
      <span id="wr-indicator" class="wr-indicator" hidden></span>
      <span id="lang-slot" class="lang-slot"></span>
      <span id="more-slot" class="more-slot"></span>
      <button id="pause" type="button" class="pause-btn" hidden></button>
      <button id="rec"><span class="rec-dot"></span><span id="rec-label" class="rec-long">Gravar</span><span id="rec-short" class="rec-short">Gravar</span></button>
      <button id="chat-toggle" aria-expanded="false" aria-controls="chat" data-i18n-title="chat.toggle" data-i18n-aria="chat.toggle" title="Pergunte ao Rice" aria-label="Pergunte ao Rice" disabled><span class="ico" data-icon="message-circle"></span><span class="lbl" data-i18n="chat.toggle">Pergunte ao Rice</span></button>
    </div>
    <div id="alerts" role="region" data-i18n-aria="alert.region" aria-label="Avisos" hidden></div>
    <main id="detail"><div class="page"></div></main>
    <button id="live-jump" type="button" hidden><span class="ico" data-icon="arrow-down"></span><span data-i18n="live.jump">Ao vivo</span></button>
  </div>
  <div class="chat-scrim" id="chat-scrim" aria-hidden="true"></div>
  <section id="chat">
    <div class="chat-head">
      <h2 data-i18n="chat.title">Pergunte ao Rice</h2>
      <button class="icon-btn" id="gchat-new" type="button" data-i18n-title="gchat.new" data-i18n-aria="gchat.new" title="Nova conversa" aria-label="Nova conversa" hidden><span class="ico" data-icon="plus"></span></button>
      <button class="icon-btn chat-close" id="chat-close" type="button" data-i18n-title="chat.close" data-i18n-aria="chat.close" title="Fechar" aria-label="Fechar"><span class="ico" data-icon="x"></span></button>
    </div>
    <div class="chat-chips">
      <button class="scope-chip" id="scope-chip" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="gchat.scope-title" title="Sobre o que o Rice responde"><span id="scope-label"></span></button>
      <button class="ai-chip" id="ai-via" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="ai.chip.title" title="Trocar a IA e o modelo"></button>
      <button class="web-chip" id="web-toggle" type="button" aria-pressed="false" data-i18n-title="chat.web.title-off" title="Buscar na web nesta conversa (desligado)" data-i18n-aria="chat.web.label" aria-label="Buscar na web" disabled></button>
    </div>
    <div class="web-note" id="web-note" role="note" hidden><span data-i18n="chat.web.note">A pergunta é enviada para a busca do provedor de IA. As notas da reunião continuam indo só para a IA.</span><button class="ghost" type="button" data-i18n="chat.web.note-dismiss">Entendi</button></div>
    <div id="messages"><p class="empty" data-i18n="chat.open-first">Abra uma reunião para conversar sobre ela.</p></div>
    <div id="messages-global" hidden></div>
    <form id="ask">
      <div class="ask-box">
        <textarea id="question" rows="1" data-i18n-placeholder="chat.placeholder" placeholder="Pergunte sobre a reunião…" data-i18n-aria="chat.placeholder" aria-label="Pergunte sobre a reunião…" autocomplete="off" spellcheck="true" disabled></textarea>
        <button class="icon-btn prompts-btn" id="prompts-btn" type="button" aria-haspopup="menu" aria-expanded="false" data-i18n-title="chat.prompts.label" data-i18n-aria="chat.prompts.label" title="Perguntas prontas" aria-label="Perguntas prontas"><span class="ico" data-icon="lightbulb"></span></button>
        <button class="send-btn" id="send" type="submit" data-i18n-title="chat.send" data-i18n-aria="chat.send" title="Enviar" aria-label="Enviar" disabled><span class="ico" data-icon="arrow-up"></span></button>
      </div>
    </form>
  </section>
  <div class="win-tools" id="win-tools">
    <button class="icon-btn" id="sidebar-toggle" data-i18n-title="win.sidebar-toggle" data-i18n-aria="win.sidebar-toggle" title="Mostrar ou recolher a barra lateral" aria-label="Mostrar ou recolher a barra lateral" aria-pressed="true"><span class="ico" data-icon="sidebar"></span></button>
  </div>
  <script src="titlebar.js"></script>
