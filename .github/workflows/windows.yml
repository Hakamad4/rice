name: windows

on:
  push:
    branches: [feat/win-native, feat/integration, main, windows, 'feat/windows-parity-*']
    paths: ['native/**', 'tests/fixtures/protocol/**', 'src/shared/frames.ts', 'src/main/session/**', '.github/workflows/windows.yml', 'scripts/build-webrtc-apm.ps1', 'vitest.config.ts', 'tests/native/**', 'src/main/screenshots/**', 'tests/screenshots/**', 'install.ps1', 'scripts/stage-native-win.ps1']
  pull_request:
    paths: ['native/**', 'tests/fixtures/protocol/**', 'src/shared/frames.ts', 'src/main/session/**', '.github/workflows/windows.yml', 'scripts/build-webrtc-apm.ps1', 'vitest.config.ts', 'tests/native/**', 'src/main/screenshots/**', 'tests/screenshots/**', 'install.ps1', 'scripts/stage-native-win.ps1']
  workflow_dispatch:

jobs:
  helpers:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: meson e ninja (versões fixas)
        run: pip install meson==1.5.2 ninja==1.11.1.1

      # O WebRTC AEC3 (webrtc-audio-processing 2.1) é compilado com MSVC (/MT, estático) a partir do tarball de native/vendor,
      # com SHA-256 fixado no script; o prefixo pronto fica em cache e só é refeito quando o script ou o tarball mudam.
      - name: Cache do webrtc-audio-processing
        id: apm-cache
        uses: actions/cache@v4
        with:
          path: native/third_party/webrtc-apm-win
          key: webrtc-apm-win-msvc-${{ hashFiles('scripts/build-webrtc-apm.ps1', 'native/vendor/webrtc-audio-processing-2.1.tar.xz') }}

      - name: Compilar o webrtc-audio-processing
        if: steps.apm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: scripts/build-webrtc-apm.ps1

      - name: Configurar (CMake + Ninja, com AEC; falha se o AEC não entrar)
        run: cmake -S native/win -B build/win -G Ninja -DCMAKE_BUILD_TYPE=Release -DRICE_REQUIRE_AEC=ON

      - name: Compilar rice-audio.exe (com AEC), rice-detector.exe e os testes
        run: cmake --build build/win

      - name: Testes portáveis (comparam com o Swift)
        run: ctest --test-dir build/win --output-on-failure

      - name: --selftest-tone contra o fixture do Swift
        shell: bash
        run: |
          build/win/rice-audio.exe --selftest-tone > tone.bin
          build/win/rice-audio.exe --selftest-gap > gap.bin 2> gap.stderr
          cmp gap.bin tests/fixtures/protocol/gap.bin
          diff gap.stderr tests/fixtures/protocol/gap.stderr || diff <(tr -d '\r' < gap.stderr) tests/fixtures/protocol/gap.stderr
          ls -l tone.bin tests/fixtures/protocol/tone.bin

      - name: Selftest do AEC no rice-audio.exe (eco sintético atrasado, energia cai e a voz sobrevive)
        shell: bash
        run: |
          build/win/rice-audio.exe --selftest-aec | tee aec.json
          node -e "const r=JSON.parse(require('fs').readFileSync('aec.json','utf8'));if(!(r.reductionDb>=15&&r.voiceLossDb<6)){console.error('AEC fraco',r);process.exit(1)}"

      - uses: actions/setup-python@v5  # node-gyp quebra com o Python 3.14 das maquinas novas
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Paridade do protocolo com o cliente TS real (modo simulado)
        shell: bash
        env:
          RICE_WIN_BIN_DIR: ${{ github.workspace }}/build/win
          RICE_EXPECT_AEC: '1'
        run: npx vitest run tests/native/win-parity.test.ts

      - name: Smoke do detector no registro real do runner (não deve falhar nem travar)
        shell: bash
        run: |
          build/win/rice-detector.exe --print-mic-processes
          build/win/rice-detector.exe --once

      - uses: actions/upload-artifact@v4
        with:
          name: rice-helpers-win-x64
          path: |
            build/win/rice-audio.exe
            build/win/rice-detector.exe
